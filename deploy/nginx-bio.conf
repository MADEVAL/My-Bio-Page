# ---------------------------------------------------------------------------
# bio.leonidov.dev - nginx + PHP-FPM. No Apache, no .htaccess.
#
# Install:
#   cp deploy/nginx-bio.conf /etc/nginx/sites-available/bio.leonidov.dev
#   ln -s ../sites-available/bio.leonidov.dev /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Adjust the PHP-FPM socket for your distribution:
#   Debian/Ubuntu : unix:/run/php/php8.5-fpm.sock
#   Arch          : unix:/run/php-fpm/php-fpm.sock
#   Alpine        : unix:/var/run/php-fpm.sock
# ---------------------------------------------------------------------------

upstream bio_php {
    server unix:/run/php/php8.5-fpm.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name bio.leonidov.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bio.leonidov.dev;

    # ssl_certificate     /etc/letsencrypt/live/bio.leonidov.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bio.leonidov.dev/privkey.pem;

    root /var/www/bio/app;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    # --- Never expose data, code, cache or secrets -------------------------
    location ~ ^/(content|src|templates|cache|tests|deploy)/ { return 404; }
    location ~ /\.(env|git|lock) { return 404; }
    location ~ \.(json|md|lock|tmp)$ { return 404; }

    # --- MCP endpoint: POST only, never cached -----------------------------
    location = /mcp {
        limit_except POST { deny all; }

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/mcp.php;
        fastcgi_pass bio_php;
    }

    location = /mcp.php {
        return 301 /mcp;
    }

    # --- Static assets: long cache -----------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Everything else goes through the front controller ------------------
    # "/" -> EN, "/ru.html" -> RU, "/sitemap.xml" -> generated
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass bio_php;
    }

    # Any other .php file is not routable
    location ~ \.php$ { return 404; }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css text/plain application/javascript application/json application/xml image/svg+xml;
}
